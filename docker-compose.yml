version: "3.9"
services:
  weaviate:
    image: semitechnologies/weaviate:1.27.3
    container_name: weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
    restart: unless-stopped

  etl_worker:
    build: .
    image: rag_app_image
    container_name: etl_worker
    command: python jobs/run_daily_etl.py
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      WEAVIATE_URL: "http://weaviate:8080"
    depends_on:
      - weaviate
    restart: on-failure

  chat_bot:
    build: .
    image: rag_app_image
    container_name: rag_bot
    command: python -m bot
    stdin_open: true
    tty: true
    volumes:
      - .:/app
    environment:
      WEAVIATE_URL: "http://weaviate:8080"
    depends_on:
      - weaviate
    restart: unless-stopped

volumes:
  weaviate_data:
  
