services:
  weaviate:
    image: semitechnologies/weaviate:1.27.3
    container_name: weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  etl_worker:
    build: .
    container_name: etl_worker
    depends_on:
      weaviate:
        condition: service_healthy
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      WEAVIATE_URL: "http://weaviate:8080"
    restart: on-failure

  chat_bot:
    build: .
    container_name: rag_bot
    depends_on:
      weaviate:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      WEAVIATE_URL: "http://weaviate:8080"
    stdin_open: true
    tty: true
    command: python -m bot.py
    restart: unless-stopped

volumes:
  weaviate_data: